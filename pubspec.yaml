name: smart_stock2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3

  # ── Google Sign-In ────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Notifications ─────────────────────────────────────────────
  flutter_local_notifications: ^17.2.3

  # ── Maps & Location ───────────────────────────────────────────
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1


  # ── Networking ────────────────────────────────────────────────
  http: ^1.2.2

  # ── File & Media ──────────────────────────────────────────────
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # ── PDF & Printing ────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.1

  # ── State Management ──────────────────────────────────────────
  provider: ^6.1.2

  # ── UI ────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/products/